AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  Spry "Paste an agenda" (Lab 6). One Lambda function, outside the VPC, behind
  a function URL: the browser sends pasted text, the function asks Claude on
  Amazon Bedrock to fill in a validated record_agenda tool call, and returns
  JSON. It needs no database and writes nothing; the person checks the
  pre-filled form and saves it through the normal API. It costs nothing while
  nobody uses it. (The $5 AWS Budgets alarm is created by scripts/ai.sh, not here:
  the Budgets resource type does not exist in every region.)

Parameters:
  ProjectName:
    Type: String
    Default: spry
  ImageUri:
    Type: String
    Description: The Lambda-target image of the backend, in ECR (the same image the report builder uses).
  CognitoRegion:
    Type: String
    Description: Region of the Cognito user pool (the function fetches its signing keys).
  CognitoUserPoolId:
    Type: String
  CognitoClientId:
    Type: String
  AllowedOrigins:
    Type: CommaDelimitedList
    Description: >-
      Origins that may call the function URL from a browser, e.g. the site's
      https://xxxx.cloudfront.net and http://localhost:3000. CORS is answered by
      the function URL itself.
  ParserModel:
    Type: String
    Default: global.anthropic.claude-haiku-4-5-20251001-v1:0
    Description: >-
      Bedrock model ID or inference profile. The default is Haiku 4.5 by its global
      profile. Claude 5.x IDs (anthropic.claude-opus-5-5, ...) need account access.
  ParserApi:
    Type: String
    Default: runtime
    AllowedValues: [runtime, mantle]
    Description: >-
      runtime = bedrock-runtime (works for every account). mantle = the
      Anthropic-style endpoint of the lab text, for the Claude 5.x models.
  ParserEffort:
    Type: String
    Default: ""
    Description: How hard the model thinks (low .. max), Claude 5.x only. Empty = do not send it.
  BedrockRegion:
    Type: String
    Default: us-east-1
    Description: Where Bedrock is called. The function itself runs in this stack's region.
Resources:
  ParserRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-agenda-parser"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: call-claude
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # "*" for now, as the lab says: which models and which regions
              # this may reach is a discussion question (docs/adr/0006).
              # InvokeModel is the bedrock-runtime route (the default here);
              # CreateInference is the Mantle route of the lab text.
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock-mantle:CreateInference
                Resource: "*"
      Tags:
        - { Key: PROJECT_NAME, Value: !Ref ProjectName }

  ParserLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-agenda-parser"
      RetentionInDays: 30

  # No VpcConfig: the function needs no database, and outside a VPC it reaches
  # Bedrock and Cognito's keys over the internet with no NAT and no endpoint.
  ParserFunction:
    Type: AWS::Lambda::Function
    DependsOn: ParserLogs
    Properties:
      FunctionName: !Sub "${ProjectName}-agenda-parser"
      PackageType: Image
      Code: { ImageUri: !Ref ImageUri }
      ImageConfig:
        Command: ["app.ai.agenda_lambda.handler"]
      Role: !GetAtt ParserRole.Arn
      Timeout: 60 # a model call may take 20 s and the SDK retries twice
      MemorySize: 512
      Environment:
        Variables:
          PARSER_MODEL: !Ref ParserModel
          PARSER_EFFORT: !Ref ParserEffort
          PARSER_API: !Ref ParserApi
          BEDROCK_REGION: !Ref BedrockRegion
          COGNITO_REGION: !Ref CognitoRegion
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_CLIENT_ID: !Ref CognitoClientId
          APP_ENV: production
      Tags:
        - { Key: PROJECT_NAME, Value: !Ref ProjectName }

  ParserUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt ParserFunction.Arn
      AuthType: NONE # the handler verifies the Cognito token itself
      Cors:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods: [POST]
        AllowHeaders: [authorization, content-type]
        MaxAge: 3600

  # A public function URL needs both statements, or callers get 403.
  UrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ParserFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  UrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ParserFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  ParserUrl:
    Description: Compiled into the frontend as NEXT_PUBLIC_PARSER_URL.
    Value: !GetAtt ParserUrl.FunctionUrl
  FunctionName:
    Value: !Ref ParserFunction
