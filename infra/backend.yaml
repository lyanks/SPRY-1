AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  Spry backend: one container on ECS Fargate behind an Application Load Balancer,
  talking to RDS PostgreSQL. Deployed by scripts/deploy-backend.sh
  (make deploy-backend).

  internet -> ALB (443, certificate from ACM; 80 redirects to 443)
           -> target group (health check GET /health)
           -> ECS service on Fargate (the image from ECR, tagged with a commit SHA)
           -> RDS PostgreSQL (private, reachable only from the service)

Parameters:
  ProjectName:
    Type: String
    Default: spry

  ImageUri:
    Type: String
    Description: Full ECR image URI including the tag, e.g. 123.dkr.ecr.eu-central-1.amazonaws.com/spry-backend:3f2a9c1

  VpcId:
    Type: AWS::EC2::VPC::Id

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Public subnets in at least two availability zones. The ALB needs two.

  DomainName:
    Type: String
    Default: ""
    Description: API hostname, e.g. api.example.com. Empty means "use the ALB's own address".

  CertificateArn:
    Type: String
    Default: ""
    Description: ACM certificate for DomainName, in THIS region (make cert-backend). Empty means HTTP only.

  HostedZoneId:
    Type: String
    Default: ""
    Description: Route 53 zone that holds DomainName. Empty means you add the DNS record by hand.

  CorsOrigins:
    Type: String
    Default: ""
    Description: Comma-separated browser origins allowed to call the API, e.g. https://app.example.com

  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 1
    Description: >-
      Keep 1 while migrations run when a container starts. Two new containers starting
      together would both try to migrate.

  DbInstanceClass:
    Type: String
    Default: db.t4g.micro

  DbAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20

Conditions:
  HasCertificate: !Not [!Equals [!Ref CertificateArn, ""]]
  HasZone: !And
    - !Not [!Equals [!Ref HostedZoneId, ""]]
    - !Not [!Equals [!Ref DomainName, ""]]

Resources:
  # --- network access ---------------------------------------------------------
  # Three layers, each allowing only the one before it:
  #   world -> ALB (80, 443) -> tasks (8000) -> database (5432)

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ProjectName} load balancer: HTTP and HTTPS from anywhere"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
      Tags:
        - { Key: PROJECT_NAME, Value: !Ref ProjectName }

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ProjectName} backend tasks: port 8000 from the load balancer only"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      Tags:
        - { Key: PROJECT_NAME, Value: !Ref ProjectName }

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ProjectName} database: PostgreSQL from the backend tasks only"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref TaskSecurityGroup
      Tags:
        - { Key: PROJECT_NAME, Value: !Ref ProjectName }

  # --- database ---------------------------------------------------------------

  # Generated here, never typed by a person and never in the repository. Letters
  # and digits only, so it can sit inside a connection URL without escaping.
  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${ProjectName}/backend/db"
      Description: !Sub "${ProjectName} database login"
      GenerateSecretString:
        SecretStringTemplate: '{"username": "spry"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true
      Tags:
        - { Key: PROJECT_NAME, Value: !Ref ProjectName }

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "${ProjectName} database subnets"
      SubnetIds: !Ref SubnetIds

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub "${ProjectName}-db"
      Engine: postgres
      # A bare major version is no longer accepted for new instances; RDS retires
      # old minors over time, so bump this when a deploy complains.
      EngineVersion: "16.10"
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: !Ref DbAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      DBName: spry
      MasterUsername: spry
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DatabaseSecret}:SecretString:password}}"
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroup
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 1
      AutoMinorVersionUpgrade: true
      Tags:
        - { Key: PROJECT_NAME, Value: !Ref ProjectName }

  # --- container --------------------------------------------------------------

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref ProjectName
      Tags:
        - { Key: PROJECT_NAME, Value: !Ref ProjectName }

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${ProjectName}-backend"
      RetentionInDays: 14

  # Lets ECS itself pull the image, write logs and read the database password.
  # The application never sees these permissions.
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-task-execution"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-database-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DatabaseSecret

  # What the application itself may do in AWS: nothing yet. Add policies here
  # when it starts calling AWS APIs.
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-task"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${ProjectName}-backend"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: backend
          Image: !Ref ImageUri
          Essential: true
          PortMappings:
            - ContainerPort: 8000
              Protocol: tcp
          Environment:
            - { Name: APP_ENV, Value: production }
            - { Name: LOG_LEVEL, Value: info }
            - { Name: CORS_ORIGINS, Value: !Ref CorsOrigins }
            # scripts/entrypoint.sh assembles DATABASE_URL from these parts.
            - { Name: DB_HOST, Value: !GetAtt Database.Endpoint.Address }
            - { Name: DB_PORT, Value: !GetAtt Database.Endpoint.Port }
            - { Name: DB_NAME, Value: spry }
            - { Name: DB_USER, Value: spry }
            # RDS for PostgreSQL 15+ refuses unencrypted connections.
            - { Name: DB_SSL, Value: require }
          Secrets:
            - Name: DB_PASSWORD
              ValueFrom: !Sub "${DatabaseSecret}:password::"
          # Container health check: liveness only. It deliberately does not touch
          # the database, so a database outage does not make ECS kill healthy
          # containers in a loop.
          HealthCheck:
            Command: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
            Interval: 15
            Timeout: 5
            Retries: 3
            StartPeriod: 40
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: backend

  # --- load balancer ----------------------------------------------------------

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${ProjectName}-api"
      Type: application
      Scheme: internet-facing
      Subnets: !Ref SubnetIds
      SecurityGroups:
        - !Ref AlbSecurityGroup
      Tags:
        - { Key: PROJECT_NAME, Value: !Ref ProjectName }

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${ProjectName}-backend"
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 8000
      TargetType: ip
      HealthCheckPath: /health
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        # A deploy waits for the old container to drain; 15 s is plenty for a
        # JSON API and keeps rollouts short.
        - { Key: deregistration_delay.timeout_seconds, Value: "15" }
      Tags:
        - { Key: PROJECT_NAME, Value: !Ref ProjectName }

  # Port 80 sends people to HTTPS when there is a certificate. Without one, the
  # stack still works over plain HTTP, which is how a first deploy can be tried
  # before DNS exists.
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - !If
          - HasCertificate
          - Type: redirect
            RedirectConfig:
              Protocol: HTTPS
              Port: "443"
              StatusCode: HTTP_301
          - Type: forward
            TargetGroupArn: !Ref TargetGroup

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # --- service ----------------------------------------------------------------

  Service:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub "${ProjectName}-backend"
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      PlatformVersion: LATEST
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        # Start the new container before stopping the old one, and if the new
        # one never turns healthy, roll back to the previous task definition.
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          # Public subnets and a public IP instead of a NAT gateway: the task
          # only needs to reach ECR and CloudWatch, and a NAT gateway bills by
          # the hour. The security group still blocks everything but the ALB.
          AssignPublicIp: ENABLED
          Subnets: !Ref SubnetIds
          SecurityGroups:
            - !Ref TaskSecurityGroup
      LoadBalancers:
        - ContainerName: backend
          ContainerPort: 8000
          TargetGroupArn: !Ref TargetGroup
      Tags:
        - { Key: PROJECT_NAME, Value: !Ref ProjectName }
        # Not used by anything. Referencing the listener here makes the service
        # wait for it, so the target group is attached to the load balancer
        # before ECS tries to register tasks with it.
        - Key: LISTENER
          Value: !If [HasCertificate, !Ref HttpsListener, !Ref HttpListener]

  DnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasZone
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt LoadBalancer.DNSName
        HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID
        EvaluateTargetHealth: true

Outputs:
  ApiUrl:
    Description: Where the frontend should send its requests.
    Value: !If
      - HasCertificate
      - !Sub "https://${DomainName}"
      - !Sub "http://${LoadBalancer.DNSName}"

  LoadBalancerDnsName:
    Description: Point a CNAME for the API hostname here if DNS is not in Route 53.
    Value: !GetAtt LoadBalancer.DNSName

  ClusterName:
    Value: !Ref Cluster

  ServiceName:
    Value: !GetAtt Service.Name

  LogGroupName:
    Value: !Ref LogGroup

  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
